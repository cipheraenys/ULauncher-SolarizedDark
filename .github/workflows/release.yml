name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package theme
        run: |
          mkdir dist
          zip -j "dist/ULauncher-SolarizedDark-${GITHUB_REF_NAME}.zip" \
            manifest.json theme.css theme-gtk-3.20.css generated.css \
            LICENSE README.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
